[project]
name = "opengloss-graph"
version = "0.1.0"
description = "Convert OpenGloss v1.1 dictionary to RDF/SKOS/OWL (Ontolex-Lemon)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "huggingface-hub>=1.9.0",
    "rdflib>=7.6.0",
    "typer>=0.24.1",
]

[project.scripts]
opengloss-graph = "opengloss_graph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opengloss_graph"]
